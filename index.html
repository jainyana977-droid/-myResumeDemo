<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Visitor Pass Management System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #eef2f5;
      padding: 20px;
    }

    h2 {
      text-align: center;
    }

    .container {
      max-width: 900px;
      margin: auto;
      background: #fff;
      padding: 20px;
      border-radius: 8px;
    }

    input, select, button {
      padding: 8px;
      margin: 5px 0;
      width: 100%;
    }

    button {
      background: #1976d2;
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 4px;
    }

    button:hover {
      background: #125aa0;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 8px;
      text-align: center;
    }

    th {
      background: #f1f1f1;
    }

    .badge {
      padding: 4px 8px;
      border-radius: 4px;
      color: white;
      font-size: 12px;
    }

    .in { background: green; }
    .out { background: red; }
  </style>
</head>

<body>

<div class="container">
  <h2>Visitor Pass Management System</h2>

  <h3>Visitor Registration</h3>
  <input id="name" placeholder="Visitor Name">
  <input id="phone" placeholder="Phone Number">
  <input id="purpose" placeholder="Purpose of Visit">
  <button onclick="registerVisitor()">Generate Pass</button>

  <h3>Search Visitor</h3>
  <input id="search" placeholder="Search by name or phone" onkeyup="render()">

  <h3>Visitor Passes</h3>
  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Phone</th>
        <th>Purpose</th>
        <th>QR Code</th>
        <th>Status</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>
</div>

<script>
  // ===== Database Simulation =====
  let visitors = JSON.parse(localStorage.getItem("visitors")) || [];

  function registerVisitor() {
    const name = document.getElementById("name").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const purpose = document.getElementById("purpose").value.trim();

    if (!name || !phone || !purpose) {
      alert("All fields are required");
      return;
    }

    visitors.push({
      id: Date.now(),
      name,
      phone,
      purpose,
      status: "OUT"
    });

    save();
    document.getElementById("name").value = "";
    document.getElementById("phone").value = "";
    document.getElementById("purpose").value = "";
  }

  function toggleStatus(id) {
    visitors = visitors.map(v => {
      if (v.id === id) {
        v.status = v.status === "IN" ? "OUT" : "IN";
      }
      return v;
    });
    save();
  }

  function render() {
    const tbody = document.getElementById("tableBody");
    const search = document.getElementById("search").value.toLowerCase();
    tbody.innerHTML = "";

    visitors
      .filter(v =>
        v.name.toLowerCase().includes(search) ||
        v.phone.includes(search)
      )
      .forEach(v => {
        tbody.innerHTML += `
          <tr>
            <td>${v.name}</td>
            <td>${v.phone}</td>
            <td>${v.purpose}</td>
            <td>QR-${v.id}</td>
            <td>
              <span class="badge ${v.status === "IN" ? "in" : "out"}">
                ${v.status}
              </span>
            </td>
            <td>
              <button onclick="toggleStatus(${v.id})">
                Check ${v.status === "IN" ? "Out" : "In"}
              </button>
            </td>
          </tr>
        `;
      });
  }

  function save() {
    localStorage.setItem("visitors", JSON.stringify(visitors));
    render();
  }

  render();
</script>

</body>
</html>
