<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>To-Do List App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      display: flex;
      justify-content: center;
      padding: 20px;
    }

    .app {
      background: #fff;
      width: 100%;
      max-width: 500px;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    input, button {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      font-size: 16px;
    }

    button {
      background: #4CAF50;
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 5px;
    }

    button:hover {
      background: #43a047;
    }

    ul {
      list-style: none;
      padding: 0;
    }

    li {
      background: #f1f1f1;
      padding: 10px;
      margin-bottom: 8px;
      border-radius: 5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    li.completed {
      text-decoration: line-through;
      background: #d1ffd6;
    }

    .actions button {
      width: auto;
      margin-left: 5px;
      padding: 5px 8px;
      font-size: 14px;
    }

    .delete {
      background: #e53935;
    }

    .delete:hover {
      background: #d32f2f;
    }

    .edit {
      background: #1e88e5;
    }

    .edit:hover {
      background: #1976d2;
    }
  </style>
</head>

<body>

  <div class="app">
    <h2>To-Do List App</h2>

    <input type="text" id="taskInput" placeholder="Enter new task">
    <button onclick="createTask()">Add Task</button>

    <input type="text" id="searchInput" placeholder="Search task" onkeyup="renderTasks()">

    <ul id="taskList"></ul>
  </div>

  <script>
    // ===== Simulated Database (localStorage) =====
    let tasks = JSON.parse(localStorage.getItem("tasks")) || [];

    // ===== API FUNCTIONS =====

    function getTasks() {
      return tasks;
    }

    function createTask() {
      const input = document.getElementById("taskInput");
      const title = input.value.trim();

      if (!title) {
        alert("Task cannot be empty");
        return;
      }

      tasks.push({
        id: Date.now(),
        title,
        completed: false
      });

      saveAndRender();
      input.value = "";
    }

    function updateTask(id) {
      const newTitle = prompt("Edit task:");
      if (!newTitle) return;

      tasks = tasks.map(task =>
        task.id === id ? { ...task, title: newTitle } : task
      );

      saveAndRender();
    }

    function toggleStatus(id) {
      tasks = tasks.map(task =>
        task.id === id ? { ...task, completed: !task.completed } : task
      );

      saveAndRender();
    }

    function deleteTask(id) {
      tasks = tasks.filter(task => task.id !== id);
      saveAndRender();
    }

    // ===== UI RENDERING =====

    function renderTasks() {
      const list = document.getElementById("taskList");
      const search = document.getElementById("searchInput").value.toLowerCase();
      list.innerHTML = "";

      getTasks()
        .filter(task => task.title.toLowerCase().includes(search))
        .forEach(task => {
          const li = document.createElement("li");
          li.className = task.completed ? "completed" : "";

          li.innerHTML = `
            <span onclick="toggleStatus(${task.id})">${task.title}</span>
            <div class="actions">
              <button class="edit" onclick="updateTask(${task.id})">Edit</button>
              <button class="delete" onclick="deleteTask(${task.id})">Delete</button>
            </div>
          `;

          list.appendChild(li);
        });
    }

    function saveAndRender() {
      localStorage.setItem("tasks", JSON.stringify(tasks));
      renderTasks();
    }

    // Initial load
    renderTasks();
  </script>

</body>
</html>
