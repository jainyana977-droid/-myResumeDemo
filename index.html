<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Web Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        h1 {
            margin-bottom: 20px;
            color: #333;
        }
        .boxes {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        .box {
            width: 100px;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #fff;
            border: 2px solid #ccc;
            cursor: pointer;
            transition: background-color 0.3s;
            font-weight: bold;
            text-transform: uppercase;
        }
        .box:hover {
            opacity: 0.8;
        }
        input {
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            width: 200px;
        }
        button {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <h1 id="greeting">Hello</h1>
    <div class="boxes">
        <div class="box" id="red">red</div>
        <div class="box" id="blue">blue</div>
        <div class="box" id="green">green</div>
        <div class="box" id="yellow">yellow</div>
    </div>
    <input type="text" id="nameInput" placeholder="Enter your name">
    <button id="greetBtn">Greet</button>

    <script>
        const greeting = document.getElementById('greeting');
        const nameInput = document.getElementById('nameInput');
        const greetBtn = document.getElementById('greetBtn');
        const redBox = document.getElementById('red');
        const blueBox = document.getElementById('blue');
        const greenBox = document.getElementById('green');
        const yellowBox = document.getElementById('yellow');

        greetBtn.addEventListener('click', () => {
            const name = nameInput.value.trim();
            if (name) {
                greeting.textContent = `Hello, ${name}`;
            } else {
                greeting.textContent = 'Hello';
            }
        });

        redBox.addEventListener('click', () => {
            redBox.style.backgroundColor = 'red';
        });

        blueBox.addEventListener('click', () => {
            blueBox.style.backgroundColor = 'blue';
        });

        greenBox.addEventListener('click', () => {
            greenBox.style.backgroundColor = 'green';
        });

        yellowBox.addEventListener('click', () => {
            yellowBox.style.backgroundColor = 'yellow';
        });
    </script>
</body>
</html>
