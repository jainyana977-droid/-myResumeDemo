<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Assignment 3 - DOM Implementation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            background: #f4f4f4;
        }

        header {
            background: #333;
            color: white;
            padding: 20px;
            font-size: 24px;
        }

        .container {
            margin-top: 40px;
        }

        .boxes {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .box {
            width: 100px;
            height: 100px;
            border: 2px solid #333;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-weight: bold;
            background-color: white;
            transition: 0.3s;
        }

        input {
            padding: 8px;
            width: 200px;
            margin-right: 10px;
        }

        button {
            padding: 8px 15px;
            cursor: pointer;
            background: #333;
            color: white;
            border: none;
        }

        button:hover {
            background: #555;
        }
    </style>
</head>
<body>

<header id="greeting">Hello</header>

<div class="container">

    <div class="boxes">
        <div class="box" data-color="red">Red</div>
        <div class="box" data-color="blue">Blue</div>
        <div class="box" data-color="green">Green</div>
        <div class="box" data-color="yellow">Yellow</div>
    </div>

    <input type="text" id="nameInput" placeholder="Enter your name">
    <button onclick="greetUser()">Greet</button>

</div>

<script>
    // Greeting function
    function greetUser() {
        var name = document.getElementById("nameInput").value;
        var greeting = document.getElementById("greeting");

        if (name.trim() !== "") {
            greeting.textContent = "Hello, " + name;
        } else {
            greeting.textContent = "Hello";
        }
    }

    // Change box color on click
    var boxes = document.querySelectorAll(".box");

    boxes.forEach(function(box) {
        box.addEventListener("click", function() {
            var color = this.getAttribute("data-color");
            this.style.backgroundColor = color;
            this.style.color = "white";
        });
    });
</script>

</body>
</html>
